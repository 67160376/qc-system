services:
  db:
    image: postgres:16-alpine
    container_name: qc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: qc_db
      POSTGRES_USER: qc_user
      POSTGRES_PASSWORD: qc_password
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_user -d qc_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./api
    container_name: qc-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgres://qc_user:qc_password@db:5432/qc_db
      JWT_SECRET: change_this_to_a_secure_secret
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node src/server.js"

  frontend:
    build:
      context: ./frontend
    container_name: qc-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
